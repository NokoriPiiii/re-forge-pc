services:
  mysql:
    image: mysql:8.0
    container_name: reforgepc-mysql
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: reforgepc
      MYSQL_USER: reforgepc
      MYSQL_PASSWORD: reforgepc_dev
      MYSQL_ROOT_PASSWORD: root_dev

    ports:
      - "3308:3306"

    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: