<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css}">
    <link rel="stylesheet" th:href="@{/css/index.css}">
    <title th:text="${product.name} + ' - ReForgePC'">Product - ReForgePC</title>

    <style>
        .product-detail-image-wrapper {
            min-height: 360px;
            overflow: hidden;
        }

        .product-detail-image {
            width: 100%;
            height: 360px;
            object-fit: contain;
        }
    </style>
</head>

<body class="d-flex flex-column min-vh-100">

    <div th:replace="~{fragments/components/toast :: toast-container}"></div>
    <div th:replace="~{fragments/layout/announcement-bar :: announcement-bar}"></div>
    <div th:replace="~{fragments/layout/header :: header}"></div>

    <main class="flex-grow-1">

        <section class="container-fluid px-3 px-lg-5 my-4">

            <div th:replace="~{fragments/layout/breadcrumbs :: dynamic-breadcrumbs(${breadcrumbs})}"></div>

            <div class="bg-white rounded-3 shadow-sm border p-4">

                <div class="row g-4">

                    <div class="col-lg-5">

                        <div class="product-detail-image-wrapper bg-light rounded-3 d-flex align-items-center justify-content-center">

                            <img th:if="${product.imageUrl != null}"
                                 th:src="${product.imageUrl}"
                                 th:alt="${product.name}"
                                 class="product-detail-image"
                                 onerror="this.onerror=null; this.style.display='none'; this.nextElementSibling.style.display='block';">

                            <i th:style="${product.imageUrl != null} ? 'display:none;' : 'display:block;'"
                               class="bi bi-pc-display-horizontal text-danger display-1"></i>

                        </div>

                    </div>

                    <div class="col-lg-7">

                        <div class="mb-2">
                            <span class="badge bg-danger"
                                  th:text="${product.productType}">
                                COMPONENT
                            </span>
                        </div>

                        <h1 class="fw-bold mb-3" th:text="${product.name}">
                            Product name
                        </h1>

                        <div class="border-bottom pb-3 mb-3">
                            <span class="text-danger fw-bold fs-3"
                                  th:text="${#numbers.formatDecimal(product.price, 0, 'POINT', 0, 'COMMA')} + '₫'">
                                0₫
                            </span>
                        </div>

                        <div class="mb-4">
                            <div class="d-flex align-items-center gap-2 mb-2">
                                <i class="bi bi-shield-check text-success"></i>
                                <span>Chính hãng · Bảo hành theo chính sách sản phẩm</span>
                            </div>

                            <div class="d-flex align-items-center gap-2">
                                <i class="bi bi-truck text-primary"></i>
                                <span>Hỗ trợ giao hàng toàn quốc</span>
                            </div>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="button" class="btn btn-danger btn-lg fw-bold px-4">
                                <i class="bi bi-cart-plus me-2"></i>
                                Thêm vào giỏ
                            </button>

                            <button type="button" class="btn btn-outline-secondary btn-lg">
                                <i class="bi bi-heart"></i>
                            </button>
                        </div>

                    </div>

                </div>

            </div>

        </section>

        <section class="container-fluid px-3 px-lg-5 my-4"
                 th:if="${!attributes.isEmpty()}">

            <div class="bg-white rounded-3 shadow-sm border p-4">

                <div class="border-bottom pb-2 mb-4">
                    <span class="fs-4 fw-bold text-dark">
                        <i class="bi bi-list-check text-danger me-2"></i>
                        Thông số kỹ thuật
                    </span>
                </div>

                <div class="border rounded-3 overflow-hidden">

                    <div th:each="item, itemStat : ${attributes}"
                         class="row g-0 border-bottom"
                         th:classappend="${itemStat.last} ? 'border-bottom-0' : ''">

                        <div class="col-md-4 bg-light px-3 py-2 fw-semibold"
                             th:text="${item.attribute.name}">
                            Socket
                        </div>

                        <div class="col-md-8 px-3 py-2"
                             th:text="${item.value}">
                            AM5
                        </div>

                    </div>

                </div>

            </div>

        </section>

    </main>

    <div th:replace="~{fragments/layout/footer :: footer}"></div>
    <div th:replace="~{fragments/layout/scripts :: scripts}"></div>

</body>

</html>
