<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css}">
    <link rel="stylesheet" th:href="@{/css/index.css}">
    <title>Linh kiện - ReForgePC</title>

    <style>
        .component-filter {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .component-filter .btn {
            white-space: nowrap;
        }

        .product-card {
            transition: box-shadow 0.2s ease, transform 0.2s ease;
        }

        .product-card:hover {
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.12);
            transform: translateY(-2px);
        }

        .product-image-wrapper {
            height: 220px;
            overflow: hidden;
            background-color: #f8f9fa;
        }

        .product-image {
            width: 100%;
            height: 100%;
            padding: 12px;
            object-fit: contain;
            transition: transform 0.35s ease;
        }

        .product-card:hover .product-image {
            transform: scale(1.04);
        }

        .product-name {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            min-height: 48px;
        }
    </style>
</head>

<body class="d-flex flex-column min-vh-100">

<div th:replace="~{fragments/components/toast :: toast-container}"></div>

<div th:replace="~{fragments/layout/announcement-bar :: announcement-bar}"></div>

<div th:replace="~{fragments/layout/header :: header}"></div>

<main class="flex-grow-1 container-fluid px-3 px-lg-5 my-4">

    <div th:replace="~{fragments/layout/breadcrumbs :: breadcrumbs('components')}"></div>

    <div class="mb-4">

        <h4 class="fw-bold text-dark mb-1">
            <i class="bi bi-cpu text-danger me-2"></i>
            LINH KIỆN MÁY TÍNH
        </h4>

        <p class="text-muted small mb-3">
            Khám phá các linh kiện máy tính tại ReForgePC.
        </p>

        <div class="component-filter">

            <a th:href="@{/products/components}"
               class="btn btn-sm"
               th:classappend="${selectedComponent == 'all'} ? 'btn-danger' : 'btn-outline-danger'">
                Tất cả
            </a>

            <a th:href="@{/products/components/cpu}"
               class="btn btn-sm"
               th:classappend="${selectedComponent == 'CPU'} ? 'btn-danger' : 'btn-outline-danger'">
                CPU
            </a>

            <a th:href="@{/products/components/gpu}"
               class="btn btn-sm"
               th:classappend="${selectedComponent == 'Card đồ hoạ'} ? 'btn-danger' : 'btn-outline-danger'">
                Card đồ hoạ
            </a>

            <a th:href="@{/products/components/ram}"
               class="btn btn-sm"
               th:classappend="${selectedComponent == 'RAM'} ? 'btn-danger' : 'btn-outline-danger'">
                RAM
            </a>

            <a th:href="@{/products/components/motherboard}"
               class="btn btn-sm"
               th:classappend="${selectedComponent == 'Bo mạch chủ'} ? 'btn-danger' : 'btn-outline-danger'">
                Bo mạch chủ
            </a>

            <a th:href="@{/products/components/storage}"
               class="btn btn-sm"
               th:classappend="${selectedComponent == 'Ổ cứng'} ? 'btn-danger' : 'btn-outline-danger'">
                Ổ cứng
            </a>

            <a th:href="@{/products/components/cpu-cooler}"
               class="btn btn-sm"
               th:classappend="${selectedComponent == 'Tản nhiệt CPU'} ? 'btn-danger' : 'btn-outline-danger'">
                Tản nhiệt CPU
            </a>

            <a th:href="@{/products/components/case}"
               class="btn btn-sm"
               th:classappend="${selectedComponent == 'Case'} ? 'btn-danger' : 'btn-outline-danger'">
                Case
            </a>

        </div>

    </div>

    <div class="row g-4">

        <div class="col-6 col-md-4 col-lg-3 col-xl-2"
             th:each="product : ${products}"
             th:if="${selectedComponent == 'all' || (product.componentType != null && product.componentType.name == selectedComponent)}">

            <a th:href="@{/products/{id}(id=${product.id})}"
               class="text-decoration-none">

                <div class="card product-card border rounded-3 overflow-hidden h-100">

                    <div class="product-image-wrapper">

                        <img th:if="${product.imageUrl != null}"
                             th:src="${product.imageUrl}"
                             th:alt="${product.name}"
                             class="product-image"
                             onerror="this.onerror=null; this.src='https://placehold.co/600x600?text=Component';">

                        <img th:unless="${product.imageUrl != null}"
                             src="https://placehold.co/600x600?text=Component"
                             th:alt="${product.name}"
                             class="product-image">

                    </div>

                    <div class="card-body p-3">

                        <div class="product-name fw-semibold text-dark mb-2"
                             th:text="${product.name}">
                            Product name
                        </div>

                        <div class="fw-bold text-danger"
                             th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 0, 'POINT')} + 'đ'">
                            920.000đ
                        </div>

                    </div>

                </div>

            </a>

        </div>

    </div>

    <div th:if="${#lists.isEmpty(products)}"
         class="text-center py-5">

        <i class="bi bi-box-seam text-muted fs-1"></i>

        <h5 class="fw-bold text-dark mt-3">
            Chưa có linh kiện
        </h5>

        <p class="text-muted small mb-0">
            Hiện tại chưa có linh kiện nào trong danh mục.
        </p>

    </div>

</main>

<div th:replace="~{fragments/layout/footer :: footer}"></div>

<div th:replace="~{fragments/layout/scripts :: scripts}"></div>

</body>
</html>
