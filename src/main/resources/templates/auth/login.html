<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ReForgePC</title>
</head>
<body>

<h1>Login</h1>

<div th:if="${error}">
    <p th:text="${error}"></p>
</div>

<div th:if="${success}">
    <p th:text="${success}"></p>
</div>

<form method="post" action="/login">

    <input
        type="hidden"
        th:name="${_csrf.parameterName}"
        th:value="${_csrf.token}"/>

    <div>
        <label for="username">Email</label>
        <input
            type="email"
            id="username"
            name="username"
            required>
    </div>

    <div>
        <label for="password">Password</label>
        <input
            type="password"
            id="password"
            name="password"
            required>
    </div>

    <button type="submit">Login</button>

</form>

</body>
</html>
