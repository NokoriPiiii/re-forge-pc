<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css}">
    <link rel="stylesheet" th:href="@{/css/index.css}">
    <title>Quên mật khẩu - ReForgePC</title>
</head>

<body class="d-flex flex-column min-vh-100">

    <div th:replace="~{fragments/components/toast :: toast-container}"></div>
    <div th:replace="~{fragments/layout/announcement-bar :: announcement-bar}"></div>
    <div th:replace="~{fragments/layout/header :: header}"></div>

    <main class="flex-grow-1 container-fluid px-3 px-lg-5 my-4">

        <div th:replace="~{fragments/layout/breadcrumbs :: breadcrumbs('forgot_password')}"></div>

        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6 col-xl-5">

                <div class="bg-white rounded-3 shadow-sm border p-4">

                    <div class="text-center mb-4">
                        <div class="rounded-circle bg-danger-subtle text-danger d-inline-flex align-items-center justify-content-center mb-3"
                             style="width: 64px; height: 64px;">
                            <i class="bi bi-key-fill fs-3"></i>
                        </div>

                        <h4 class="fw-bold text-dark mb-2">
                            Quên mật khẩu?
                        </h4>

                        <p class="text-muted mb-0">
                            Nhập email tài khoản của bạn để nhận hướng dẫn đặt lại mật khẩu.
                        </p>
                    </div>

                    <form th:action="@{/forgot-password}" method="post">

                        <div class="mb-4">
                            <label for="email" class="form-label fw-semibold">
                                Email đăng nhập
                            </label>

                            <div class="input-group">
                                <span class="input-group-text bg-light">
                                    <i class="bi bi-envelope text-danger"></i>
                                </span>

                                <input type="email"
                                       id="email"
                                       name="email"
                                       class="form-control"
                                       placeholder="Nhập email của bạn"
                                       autocomplete="email"
                                       required>
                            </div>
                        </div>

                        <button type="submit"
                                class="btn btn-danger w-100 fw-bold py-2">
                            <i class="bi bi-send me-2"></i>
                            GỬI YÊU CẦU
                        </button>

                    </form>

                    <div class="text-center mt-4">
                        <a th:href="@{/login}"
                           class="text-danger text-decoration-none small">
                            <i class="bi bi-arrow-left me-1"></i>
                            Quay lại đăng nhập
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/layout/footer :: footer}"></div>
    <div th:replace="~{fragments/layout/scripts :: scripts}"></div>

</body>
</html>
