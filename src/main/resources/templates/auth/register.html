<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css}">
    <link rel="stylesheet" th:href="@{/css/index.css}">
    <title>Đăng ký - ReForgePC</title>
</head>

<body class="d-flex flex-column min-vh-100">

    <div th:replace="~{fragments/components/toast :: toast-container}"></div>
    <div th:replace="~{fragments/layout/announcement-bar :: announcement-bar}"></div>
    <div th:replace="~{fragments/layout/header :: header}"></div>

    <main class="flex-grow-1 container-fluid px-3 px-lg-5 my-4">

        <nav aria-label="breadcrumb" class="mb-3">
            <ol class="breadcrumb">
                <li class="breadcrumb-item">
                    <a th:href="@{/}" class="text-decoration-none text-muted">Trang chủ</a>
                </li>
                <li class="breadcrumb-item active text-danger fw-semibold" aria-current="page">
                    Đăng ký
                </li>
            </ol>
        </nav>

        <div class="mb-4">
            <h4 class="fw-bold text-dark mb-1">
                <i class="bi bi-person-plus-fill text-danger me-2"></i>
                ĐĂNG KÝ TÀI KHOẢN
            </h4>
            <p class="text-muted small mb-0">
                Tạo tài khoản ReForgePC để trải nghiệm đầy đủ các tiện ích dành cho thành viên.
            </p>
        </div>

        <div class="row justify-content-center">
            <div class="col-lg-6 col-xl-5">
                <div class="bg-white rounded-3 shadow-sm border p-4">

                    <div class="border-bottom pb-3 mb-4">
                        <h5 class="fw-bold text-dark mb-1">
                            <i class="bi bi-person-plus-fill text-danger me-2"></i>
                            Tạo tài khoản khách hàng cá nhân
                        </h5>
                        <p class="text-muted small mb-0">
                            Điền thông tin bên dưới để đăng ký tài khoản.
                        </p>
                    </div>

                    <form th:action="@{/register}" th:object="${registerRequest}" method="post">

                        <div class="mb-3">
                            <label for="email" class="form-label fw-semibold">
                                Email đăng ký<span class="text-danger"> *</span>
                            </label>

                            <div class="input-group">
                                <span class="input-group-text bg-light">
                                    <i class="bi bi-envelope text-danger"></i>
                                </span>

                                <input type="email"
                                       id="email"
                                       th:field="*{email}"
                                       class="form-control"
                                       placeholder="Nhập email của bạn"
                                       autocomplete="email"
                                       required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label fw-semibold">
                                Mật khẩu<span class="text-danger"> *</span>
                            </label>

                            <div class="input-group">
                                <span class="input-group-text bg-light">
                                    <i class="bi bi-lock-fill text-danger"></i>
                                </span>

                                <input type="password"
                                       id="password"
                                       th:field="*{password}"
                                       class="form-control"
                                       placeholder="Nhập mật khẩu"
                                       autocomplete="new-password"
                                       required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="confirmPassword" class="form-label fw-semibold">
                                Nhập lại mật khẩu<span class="text-danger"> *</span>
                            </label>

                            <div class="input-group">
                                <span class="input-group-text bg-light">
                                    <i class="bi bi-lock-fill text-danger"></i>
                                </span>

                                <input type="password"
                                       id="confirmPassword"
                                       th:field="*{confirmPassword}"
                                       class="form-control"
                                       placeholder="Nhập lại mật khẩu"
                                       autocomplete="new-password"
                                       required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-danger w-100 fw-bold py-2">
                            <i class="bi bi-person-plus-fill me-2"></i>
                            ĐĂNG KÝ TÀI KHOẢN
                        </button>

                    </form>

                    <div class="text-center mt-3">
                        <span class="text-muted small">Đã có tài khoản?</span>
                        <a th:href="@{/login}" class="text-danger text-decoration-none small fw-semibold">
                            Đăng nhập
                        </a>
                    </div>

                </div>
            </div>
        </div>

    </main>

    <div th:replace="~{fragments/layout/footer :: footer}"></div>
    <div th:replace="~{fragments/layout/scripts :: scripts}"></div>

</body>
</html>
