<form th:fragment="search-bar"
      th:action="@{/search}"
      method="get"
      class="w-full">

    <label for="header-search" class="sr-only">
        Tìm kiếm
    </label>

    <div class="relative">

        <input
            id="header-search"
            type="search"
            name="q"
            placeholder="Bạn đang tìm gì?"
            autocomplete="off"
            class="h-11 w-full rounded-lg border border-gray-700 bg-white px-4 pr-12 text-sm text-gray-900 outline-none transition placeholder:text-gray-400 focus:border-red-500 focus:ring-1 focus:ring-red-500">

        <button
            type="submit"
            aria-label="Tìm kiếm"
            class="absolute right-0 top-0 flex h-11 w-12 items-center justify-center text-gray-500 transition hover:text-red-600">

            <i data-lucide="search" class="size-5"></i>

        </button>

    </div>

</form>
