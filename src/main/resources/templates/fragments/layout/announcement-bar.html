<div th:fragment="announcement-bar"
     class="bg-black text-white">

    <div class="container-fluid px-3 px-lg-5">

        <div class="d-flex align-items-center justify-content-between py-1 small">

            <!-- Left -->
            <div class="d-none d-md-flex align-items-center gap-4">

                <span class="d-flex align-items-center gap-1">
                    <i class="bi bi-geo-alt text-danger"></i>
                    <span>Showroom HN: Trần Thái Tông | TP.HCM: Lý Thường Kiệt</span>
                </span>

                <span class="d-flex align-items-center gap-1">
                    <i class="bi bi-telephone text-warning"></i>
                    <span>Hotline: 0828.333.363 - 0988.882.838</span>
                </span>

            </div>

            <!-- Right -->
            <div class="ms-auto d-flex align-items-center gap-3 gap-lg-4">

                <a th:href="@{/warranty-lookup}"
                   class="d-flex align-items-center gap-1 text-white text-decoration-none">
                    <i class="bi bi-shield-check text-success"></i>
                    <span>Tra Cứu Bảo Hành</span>
                </a>

                <a th:href="@{/installment}"
                   class="d-flex align-items-center gap-1 text-white text-decoration-none">
                    <i class="bi bi-percent text-info"></i>
                    <span>Trả Góp 0%</span>
                </a>

                <a th:href="@{/contact}"
                   class="d-flex align-items-center gap-1 text-white text-decoration-none">
                    <i class="bi bi-envelope text-white"></i>
                    <span>Liên Hệ</span>
                </a>

            </div>

        </div>

    </div>

</div>
