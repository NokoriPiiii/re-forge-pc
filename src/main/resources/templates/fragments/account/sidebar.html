<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<body>

<div th:fragment="sidebar"
     class="bg-white rounded-3 shadow-sm border p-3">

    <div class="d-flex align-items-center gap-3 pb-3 mb-3 border-bottom">

        <div class="rounded-circle bg-danger-subtle text-danger d-flex align-items-center justify-content-center flex-shrink-0"
             style="width: 56px; height: 56px;">
            <i class="bi bi-person-fill fs-4"></i>
        </div>

        <div class="overflow-hidden">
            <div class="text-muted small">Tài khoản</div>
            <div class="fw-bold text-dark text-truncate">Nguyễn Văn A</div>
        </div>

    </div>

    <div class="list-group list-group-flush">

        <a th:href="@{/account/profile}"
           class="list-group-item list-group-item-action border-0 rounded-2 px-2 py-3">
            <i class="bi bi-person-circle text-danger me-2"></i>
            <span class="fw-semibold">Thông tin tài khoản</span>
        </a>

        <a th:href="@{/account/orders}"
           class="list-group-item list-group-item-action border-0 rounded-2 px-2 py-3">
            <i class="bi bi-box-seam text-primary me-2"></i>
            <span class="fw-semibold">Đơn hàng</span>
        </a>

        <a th:href="@{/account/change-password}"
           class="list-group-item list-group-item-action border-0 rounded-2 px-2 py-3">
            <i class="bi bi-shield-lock text-warning me-2"></i>
            <span class="fw-semibold">Đổi mật khẩu</span>
        </a>

        <form th:action="@{/logout}" method="post" class="m-0">
            <button type="submit"
                    class="list-group-item list-group-item-action border-0 rounded-2 px-2 py-3 text-danger w-100 text-start">
                <i class="bi bi-box-arrow-right me-2"></i>
                <span class="fw-semibold">Đăng xuất</span>
            </button>
        </form>

    </div>

</div>

</body>
</html>
