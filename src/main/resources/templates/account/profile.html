<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<body>

        <i class="bi bi-person-circle text-danger fs-4"></i>

    </div>

    <div class="row g-3">

        <div class="col-md-6">
            <label class="form-label fw-semibold">Email</label>
            <input type="email"
                   class="form-control"
                   value="nguyenvana@example.com"
                   disabled>
        </div>

        <div class="col-md-6">
            <label class="form-label fw-semibold">Vai trò</label>
            <input type="text"
                   class="form-control"
                   value="USER"
                   disabled>

        <div class="col-md-6">
            <label class="form-label fw-semibold">Trạng thái tài khoản</label>
            <input type="text"
                   class="form-control"
                   value="Đang hoạt động"
                   disabled>
        </div>

    </div>

</div>

</body>
</html>
