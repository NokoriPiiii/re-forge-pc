<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<body>

    <div th:fragment="change-password">

        <div class="d-flex align-items-center gap-2 mb-4">
            <i class="bi bi-shield-lock text-warning fs-4"></i>
            <h5 class="fw-bold mb-0">Đổi mật khẩu</h5>
        </div>

        <form th:action="@{/account/change-password}" method="post">

            <div class="mb-3">
                <label for="currentPassword" class="form-label fw-semibold">
                    Mật khẩu hiện tại
                </label>
                <input type="password"
                       id="currentPassword"
                       name="currentPassword"
                       class="form-control"
                       placeholder="Nhập mật khẩu hiện tại"
                       autocomplete="current-password"
                       required>

                <div class="text-end mt-2">
                    <a th:href="@{/forgot-password}"
                       class="text-danger text-decoration-none small">
                        Quên mật khẩu?
                    </a>
                </div>
            </div>

            <div class="mb-3">
                <label for="newPassword" class="form-label fw-semibold">
                    Mật khẩu mới
                </label>
                <input type="password"
                       id="newPassword"
                       name="newPassword"
                       class="form-control"
                       placeholder="Nhập mật khẩu mới"
                       autocomplete="new-password"
                       required>
            </div>

            <div class="mb-4">
                <label for="confirmPassword" class="form-label fw-semibold">
                    Xác nhận mật khẩu mới
                </label>
                <input type="password"
                       id="confirmPassword"
                       name="confirmPassword"
                       class="form-control"
                       placeholder="Nhập lại mật khẩu mới"
                       autocomplete="new-password"
                       required>
            </div>

            <button type="submit"
                    class="btn btn-danger">
                <i class="bi bi-check2-circle me-1"></i>
                Đổi mật khẩu
            </button>

        </form>

    </div>

</body>
</html>
