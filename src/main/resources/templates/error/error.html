<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet"
          th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}">

    <link rel="stylesheet"
          th:href="@{/webjars/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css}">

    <link rel="stylesheet"
          th:href="@{/css/index.css}">

    <title>Lỗi - ReForgePC</title>
</head>

<body class="d-flex flex-column min-vh-100">

    <div th:replace="~{fragments/components/toast :: toast-container}"></div>

    <div th:replace="~{fragments/layout/announcement-bar :: announcement-bar}"></div>

    <div th:replace="~{fragments/layout/header :: header}"></div>

    <main class="flex-grow-1 container-fluid px-3 px-lg-5 my-4">

        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">

                <div class="bg-white rounded-3 shadow-sm border p-5 text-center">

                    <div class="rounded-circle bg-danger-subtle text-danger d-inline-flex align-items-center justify-content-center mb-4"
                         style="width: 72px; height: 72px;">
                        <i class="bi bi-exclamation-triangle-fill fs-2"></i>
                    </div>

                    <h4 class="fw-bold text-dark mb-2">
                        Đã xảy ra lỗi
                    </h4>

                    <p class="text-muted mb-4">
                        Hệ thống đã gặp một lỗi không mong muốn.
                        Vui lòng thử lại sau.
                    </p>

                    <a th:href="@{/}"
                       class="btn btn-danger">
                        <i class="bi bi-house me-1"></i>
                        Về trang chủ
                    </a>

                </div>

            </div>
        </div>

    </main>

    <div th:replace="~{fragments/layout/footer :: footer}"></div>

    <div th:replace="~{fragments/layout/scripts :: scripts}"></div>

</body>
</html>
